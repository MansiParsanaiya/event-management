<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Events | Reserve Your Date</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
    
</head>

<body>
    <div id="header-placeholder2"></div>

    <main class="booking-page">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <section class="booking-card">
            <div class="card-header">
                <h2>Secure Your <span class="text-gradient">Event</span></h2>
                <p>Let's turn your vision into an iconic experience.</p>
            </div>

            <form id="newBookingForm">
                <div class="input-grid">
                    <div class="input-group">
                        <label><i class="fa-solid fa-user"></i> Full Name</label>
                        <input type="text" placeholder="e.g. Alex Johnson" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fa-solid fa-envelope"></i> Business Email</label>
                        <input type="email" placeholder="alex@company.com" required>
                    </div>
                </div>

                <div class="input-grid">
                    <div class="input-group">
                        <label><i class="fa-solid fa-calendar-day"></i> Preferred Date</label>
                        <input type="date" required>
                    </div>
                    <div class="input-group">
                        <label><i class="fa-solid fa-layer-group"></i> Event Category</label>
                        <select required>
                            <option value="" disabled selected>Select an option</option>
                            <option>Corporate Conference</option>
                            <option>Luxury Wedding</option>
                            <option>Product Launch</option>
                            <option>Private Gala</option>
                        </select>
                    </div>
                </div>

                <div class="input-group full-width">
                    <label><i class="fa-solid fa-comment-dots"></i> Your Vision</label>
                    <textarea rows="4" placeholder="Briefly describe what you have in mind..."></textarea>
                </div>

                <button type="submit" class="submit-glow">
                    Send Inquiry <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/load-components.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/booking.js"></script>

</body>

</html>
