<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details — EMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/index.css"> 
    <script defer src="js/script.js"></script>
</head>

<body>
    <header class="nav-wrap">
        <div class="container nav">
            <a class="logo" href="index.html">EMS</a>
            <nav id="main-nav" class="nav-links">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
            </nav>
            <button id="hamburger" class="hamburger">☰</button>
            <button id="theme-toggle" class="theme-toggle">🌓</button>
        </div>
    </header>

    <main class="container section">
        <div id="event-detail" class="event-detail">
            <!-- populated by script.js based on query param ?id= -->
        </div>

        <!-- Register Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" data-close>✕</button>
                <h3>Register for this event</h3>
                <form id="modal-register-form">
                    <label>Name<input name="name" required></label>
                    <label>Email<input name="email" type="email" required></label>
                    <label>Phone<input name="phone" required></label>
                    <label>Tickets<select name="tickets">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                        </select></label>
                    <button type="submit" class="btn">Confirm</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© <span id="year4"></span> EMS</p>
        </div>
    </footer>
</body>

</html>
