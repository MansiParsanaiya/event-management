<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — EMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/index.css"> 
    <script defer src="js/script.js"></script>
</head>

<body>
   <div id="header-placeholder"></div>
    <main class="container section">
        <h1>Contact Us</h1>
        <form id="contact-form" class="form">
            <label>Name<input id="c-name" required></label>
            <label>Email<input id="c-email" type="email" required></label>
            <label>Message<textarea id="c-msg" required></textarea></label>
            <button type="submit" class="btn">Send</button>
        </form>

        <section class="map">
            <h3>Our Location</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18..." loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <section class="faq">
            <h3>FAQ</h3>
            <div class="accordion">
                <button class="accordion-toggle">How do I register?</button>
                <div class="accordion-panel">Use the register page or open an event and click Register.</div>

                <button class="accordion-toggle">Is payment online?</button>
                <div class="accordion-panel">This is a frontend-only demo — payments are not implemented.</div>
            </div>
        </section>
    </main>

       <div id="footer-placeholder"></div>
    <script src="js/load-components.js"></script>
</body>

</html>
