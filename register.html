<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — EMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/index.css"> 
    <script defer src="js/script.js"></script>
</head>

<body>
    <header class="nav-wrap">
        <div class="container nav">
            <a class="logo" href="index.html">EMS</a>
            <nav id="main-nav" class="nav-links">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="register.html" class="active">Register</a>
            </nav>
            <button id="hamburger" class="hamburger">☰</button>
            <button id="theme-toggle" class="theme-toggle">🌓</button>
        </div>
    </header>

    <main class="container section">
        <h1>Register for an Event</h1>
        <form id="register-form" class="form">
            <label>Name<input id="r-name" required></label>
            <label>Email<input id="r-email" type="email" required></label>
            <label>Phone<input id="r-phone" required></label>
            <label>Select Event
                <select id="r-event" required></select>
            </label>
            <label>Tickets<select id="r-tickets">
                    <option>1</option>
                    <option>2</option>
                </select></label>
            <button type="submit" class="btn">Register</button>
        </form>
        <div id="register-msg" class="toast hidden"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© <span id="year5"></span> EMS</p>
        </div>
    </footer>
</body>

</html>
