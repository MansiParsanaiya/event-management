<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Premium Image Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f6f8;
            font-family: sans-serif;
        }

        .carousel {
            position: relative;
            width: 80%;
            height: 420px;
            margin: 80px auto;
            overflow: hidden;
        }

        .track {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70%;
            height: 100%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 30px;
            /* box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25); */
        }

        /* CENTER */
        .slide.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            z-index: 3;
        }

        /* LEFT */
        .slide.prev {
            transform: translate(-120%, -50%) scale(0.75);
            opacity: 0.4;
            z-index: 2;
        }

        /* RIGHT */
        .slide.next {
            transform: translate(20%, -50%) scale(0.75);
            opacity: 0.4;
            z-index: 2;
        }

        /* NAV BUTTONS */
        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .left {
            left: 20px;
        }

        .right {
            right: 20px;
        }

        
    </style>
</head>

<body>

    <section class="carousel">
        <button class="nav left">&#10094;</button>

        <div class="track">
            <div class="slide"><img src="images/img1.jpg"></div>
            <div class="slide"><img src="images/img2.png"></div>
            <div class="slide"><img src="images/img3.jpg"></div>
            <div class="slide"><img src="images/img4.jpg"></div>
        </div>

        <button class="nav right">&#10095;</button>
    </section>

    <script>
        const slides = document.querySelectorAll('.slide');
        let current = 0;

        function updateSlides() {
            slides.forEach(slide => {
                slide.classList.remove('active', 'prev', 'next');
            });

            slides[current].classList.add('active');

            const prev = (current - 1 + slides.length) % slides.length;
            const next = (current + 1) % slides.length;

            slides[prev].classList.add('prev');
            slides[next].classList.add('next');
        }

        document.querySelector('.right').addEventListener('click', () => {
            current = (current + 1) % slides.length;
            updateSlides();
        });

        document.querySelector('.left').addEventListener('click', () => {
            current = (current - 1 + slides.length) % slides.length;
            updateSlides();
        });

        updateSlides();


    </script>
</body>

</html>
