<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Events | Event Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div id="header-placeholder2"></div>

    <main>
        <div class="glow-orb orb-v1"></div>
        <div class="glow-orb orb-v2"></div>
        <div class="glow-orb orb-v3"></div>
        
        <section class="gallery-hero">
            <div class="container"><br><br><br><br>
                <h1>Moments We've Managed</h1>
                <p>A visual showcase of our most memorable corporate summits, grand weddings, and vibrant festivals.</p>
            </div><br><br><br><br>
        </section>
<br><br><br><br>
        <section class="gallery-section">
            <div class="container">
                <h2 class="section-heading">Our Event Portfolio</h2>

                <div class="photo-grid" id="photo-grid">

                    <div class="grid-item item-wide item-tall" data-title="Tech Summit Keynote"
                        data-desc="Opening address at the annual Future Tech Summit.">
                        <img src="images/pexels-kerim-isazade-2148708032-31129059.jpg" alt="Keynote speaker on stage">
                    </div>

                    <div class="grid-item" data-title="Cocktail Hour Setup"
                        data-desc="Elegant pre-dinner reception with modern lighting.">
                        <img src="images/pexels-bertellifotografia-16120263.jpg" alt="Elegant cocktail bar setup">
                    </div>

                    <div class="grid-item item-tall" data-title="Outdoor Festival Crowd"
                        data-desc="A vibrant crowd enjoying the main stage performance.">
                        <img src="images/pexels-wendywei-1540406.jpg" alt="Crowd at an outdoor music festival">
                    </div>

                    <div class="grid-item item-wide" data-title="Product Launch Booth"
                        data-desc="Interactive display for a major product unveiling.">
                        <img src="images/pexels-bertellifotografia-34774353.jpg"
                            alt="Interactive product display booth">
                    </div>

                    <div class="grid-item" data-title="Gala Dinner Lighting"
                        data-desc="Ambient lighting and table setting for a corporate gala.">
                        <img src="images/pexels-gaby-tenda-1075944-2716728.jpg" alt="Beautifully lit dinner tables">
                    </div>

                    <div class="grid-item item-wide" data-title="Wedding Reception"
                        data-desc="First dance under a chandelier.">
                        <img src="images/pexels-8pcarlos-morocho-2150734957-33880481.jpg"
                            alt="A couple's first dance at a wedding">
                    </div>

                    <div class="grid-item" data-title="Workshop Session"
                        data-desc="A breakout session at a business seminar.">
                        <img src="images/pexels-mikael-blomkvist-6476783.jpg" alt="People collaborating in a workshop">
                    </div>

                    <div class="grid-item item-tall" data-title="Venue Exterior"
                        data-desc="Grand entrance to the convention center.">
                        <img src="images/pexels-thevisionaryvows-32854443.jpg"
                            alt="Exterior of a large convention venue">
                    </div>

                    <div class="grid-item item-tall" data-title="Venue Exterior"
                        data-desc="Grand entrance to the convention center.">
                        <img src="images/pexels-reneterp-2504969.jpg" alt="Exterior of a large convention venue">
                    </div>

                    <div class="grid-item" data-title="Food & Catering"
                        data-desc="Gourmet food display by our catering partner.">
                        <img src="images/pexels-jonathanborba-29098355.jpg" alt="Close-up of a gourmet food spread">
                    </div>

                    <div class="grid-item" data-title="Food & Catering"
                        data-desc="Gourmet food display by our catering partner.">
                        <img src="images/pexels-pixabay-50675.jpg" alt="Close-up of a gourmet food spread">
                    </div>

                </div>
            </div>
        </section>

    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <div class="lightbox-content">
            <img id="lightbox-image" src="" alt="Gallery Image">
            <div class="lightbox-caption">
                <h3 id="lightbox-title"></h3>
                <p id="lightbox-desc"></p>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/load-components.js"></script>

    <script src="js/gallery.js"></script>
</body>

</html>
